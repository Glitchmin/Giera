apply plugin: 'com.android.application'

// Repository root (android/app -> ../..)
def repoRoot = file('../..')

android {
    namespace 'com.glitchmin.giera'
    compileSdk 34
    ndkVersion '28.0.12433566'

    defaultConfig {
        applicationId 'com.glitchmin.giera'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DGIERA_BUILD_TESTS=OFF',
                          '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
                // arm64 for phones, x86_64 for the emulator
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    // The same CMakeLists.txt that builds the Windows game builds libmain.so here.
    externalNativeBuild {
        cmake {
            path "${repoRoot}/CMakeLists.txt"
            version '3.30.5'
        }
    }

    sourceSets {
        main {
            // SDL's Java glue must match the SDL C sources, so take it from external/SDL.
            java.srcDirs += "${repoRoot}/external/SDL/android-project/app/src/main/java"
            // The repo's assets/ folder is packed as "assets/..." inside the APK, which is
            // exactly the relative path the game uses on desktop (SAVE_FILES_PATH).
            assets.srcDirs = [layout.buildDirectory.dir('generated/gameAssets')]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so `assembleRelease` produces an installable APK.
            // Replace with a real signing config before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

def copyGameAssets = tasks.register('copyGameAssets', Copy) {
    from "${repoRoot}/assets"
    into layout.buildDirectory.dir('generated/gameAssets/assets')
}
tasks.named('preBuild') { dependsOn copyGameAssets }
